<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ff8fab" />
  <title>El Prode de Sofía</title>
  <meta name="description" content="Adiviná cómo va a llegar Sofía: peso, talla, fecha y más. ¡Sumá tu predicción!" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👶</text></svg>" />
  <link rel="stylesheet" href="css/styles.css?v=5" />
</head>
<body>
  <div class="wrap">
    <button id="btn-idioma" class="btn-idioma" type="button" aria-label="Cambiar idioma / Change language">🌐 EN</button>
    <header>
      <div class="bebe-emoji">👶🎀</div>
      <h1 id="titulo">El Prode de Sofía</h1>
      <p class="subtitulo" id="subtitulo">Adiviná cómo va a llegar nuestra bebé 👶🎀</p>
      <div class="countdown" id="countdown"></div>
    </header>

    <div class="aviso-demo" id="aviso-demo" data-i18n-html="aviso_demo"></div>

    <nav class="tabs">
      <button class="tab activa" data-vista="jugar" data-i18n="tab_jugar">✍️ Jugar</button>
      <button class="tab" data-vista="participantes" data-i18n="tab_participantes">👨‍👩‍👧 Participantes</button>
      <button class="tab" data-vista="tabla" data-i18n="tab_posiciones">🏆 Posiciones</button>
    </nav>

    <!-- ============ JUGAR ============ -->
    <section class="vista activa" id="vista-jugar">
      <div class="card">
        <h2 data-i18n="jugar_titulo">Hacé tu predicción ✨</h2>
        <p class="intro" data-i18n="jugar_intro">Completá tus pronósticos sobre la llegada de Sofía. ¡El que más se acerque gana!</p>
        <form id="form-prediccion" autocomplete="off">
          <label class="campo">
            <span class="campo-label" data-i18n="nombre_label">🙋 Tu nombre</span>
            <input type="text" id="nombre" name="nombre" maxlength="40" data-i18n-ph="nombre_ph" placeholder="Ej: Tía Caro" required />
          </label>
          <div class="grid-campos" id="campos"></div>
          <label class="campo" id="captcha-campo">
            <span class="campo-label"><span data-i18n="captcha_label">🤖 Verificación:</span> <span id="captcha-pregunta"></span></span>
            <input type="number" id="captcha-respuesta" inputmode="numeric" data-i18n-ph="captcha_ph" placeholder="Escribí el resultado" required />
          </label>
          <button type="submit" class="btn" id="btn-enviar" data-i18n="btn_enviar">¡Enviar mi predicción! 🎉</button>
        </form>
      </div>
      <div class="footer">
        <button class="btn btn-sec" id="btn-compartir" data-i18n="btn_compartir">🔗 Compartir el juego</button>
      </div>
    </section>

    <!-- ============ PARTICIPANTES ============ -->
    <section class="vista" id="vista-participantes">
      <div class="subhead">
        <h2 data-i18n="participantes_titulo">Participantes</h2>
        <span class="contador-pill"><b id="contador-part">0</b> <span data-i18n="jugando">jugando 🎈</span></span>
      </div>
      <div id="lista-participantes"></div>
    </section>

    <!-- ============ TABLA ============ -->
    <section class="vista" id="vista-tabla">
      <div class="subhead"><h2 data-i18n="tabla_titulo">Tabla de posiciones 🏆</h2></div>
      <div id="resultado-real"></div>
      <div id="tabla"></div>
    </section>

    <footer class="creditos">
      <span data-i18n="footer_hecho">Hecho con 💗 para Sofía · </span><a href="admin.html">admin</a>
    </footer>
  </div>

  <div class="toast" id="enviado" data-i18n="toast_enviado">¡Tu predicción quedó guardada! 🎉</div>

  <script type="module" src="js/app.js?v=5"></script>
</body>
</html>
